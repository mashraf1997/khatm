<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C2D12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Loyalty card</title>
<style>
  /* Customer card: one phone screen, big stamps, works offline-ish once loaded */
  :root { --c: #7C2D12; --ink: #1C1917; --muted: #78716C; --bg: #FAFAF9; --card: #FFFFFF; --line: #E7E5E4; --good: #15803D; --bad: #B91C1C; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.55 "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 16px; }
  .head { text-align: center; display: grid; gap: 4px; }
  .head .logo { font-size: 2.6rem; line-height: 1; }
  .head h1 { margin: 0; font-size: 1.5rem; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  .loyalty { background: var(--c); color: #fff; border: 0; }
  .loyalty .muted { color: rgba(255,255,255,.75); }
  .stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stamp { aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,.55); display: grid; place-items: center; font-size: 1.6rem; }
  .stamp.on { background: #fff; border: 2px solid #fff; animation: pop .35s ease-out both; }
  .stamp.gift { border-style: solid; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  label { display: grid; gap: 6px; font-weight: 600; }
  input { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; width: 100%; }
  input:focus { outline: 2px solid var(--c); border-color: var(--c); }
  button { font: inherit; font-weight: 700; padding: 13px 18px; border-radius: 12px; border: 0; background: var(--c); color: #fff; cursor: pointer; width: 100%; }
  button.ghost { background: transparent; color: var(--c); border: 1px solid var(--line); }
  button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  .msg { text-align: center; padding: 14px; border-radius: 14px; font-weight: 600; }
  .msg.good { background: #DCFCE7; color: var(--good); }
  .msg.bad { background: #FEE2E2; color: var(--bad); }
  .big { font-size: 3.5rem; text-align: center; line-height: 1; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .1em; }
  .foot { text-align: center; font-size: .8rem; }
  .foot a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .stamp.on { animation: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="/card.js"></script>
</body>
</html>
