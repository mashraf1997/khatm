<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khatm</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  :root { --accent: #9A3412; --accent-soft: #FFEDD5; }
  @media (prefers-color-scheme: dark) { :root { --accent: #FDBA74; --accent-ink: #2A1205; --accent-soft: #3A1E0C; } }
  .poster { display: grid; justify-items: center; gap: 10px; text-align: center; }
  .poster img { width: 220px; height: 220px; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
  .mini-stamps { display: inline-flex; gap: 3px; flex-wrap: wrap; }
  .mini-stamps i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-block; }
  .mini-stamps i.on { background: var(--accent); border-color: var(--accent); }
  @media print { .rail, .mobile-nav, .no-print { display: none !important; } .shell { display: block; } .print-only { display: block !important; } }
  .print-only { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
<script src="demo.js"></script>
</body>
</html>
