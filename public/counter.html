<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Counter</title>
<style>
  /* Full-screen counter display: a QR that changes every minute so photos of it stop working */
  :root { --c: #7C2D12; color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--c); color: #fff; font: 18px/1.5 "Segoe UI", "Noto Sans Arabic", Tahoma, system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  .box { display: grid; gap: 18px; justify-items: center; }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.6rem); }
  .qr { background: #fff; border-radius: 24px; padding: 18px; width: min(70vmin, 460px); aspect-ratio: 1; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .bar { width: min(70vmin, 460px); height: 6px; background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; transition: width 1s linear; }
  .sub { opacity: .85; }
  a { color: #fff; }
</style>
</head>
<body>
<div class="box" id="box"><p>…</p></div>
<script>
(function () {
  'use strict';
  var box = document.getElementById('box');
  var ar = !/^en\b/i.test(navigator.language || '');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var info = null, expires = 0, total = 1;
  function api(p, body) {
    return fetch(p, { method: body ? 'POST' : 'GET', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); });
  }
  function refresh() {
    api('/api/counter/code', {}).then(function (r) {
      if (r.status === 401) { box.innerHTML = '<p>' + (ar ? 'سجّل دخول للوحة التحكم الأول' : 'Sign in to the dashboard first') + '</p><a href="/">' + (ar ? 'لوحة التحكم' : 'Dashboard') + '</a>'; return; }
      var s = info.settings;
      document.documentElement.style.setProperty('--c', s.color);
      expires = Date.parse(r.data.expiresAt); total = expires - Date.now();
      box.innerHTML = '<h1>' + esc(s.emoji) + ' ' + (ar ? 'امسح الكود وخد ختمك' : 'Scan to get your stamp') + '</h1>' +
        '<div class="qr">' + r.data.svg + '</div><div class="bar"><i id="t" style="width:100%"></i></div>' +
        '<div class="sub">' + esc(ar ? ('جمّع ' + s.stampsNeeded + ' وخد ' + s.reward) : ('Collect ' + s.stampsNeeded + ', get ' + s.reward)) + '</div>';
    });
  }
  setInterval(function () {
    var left = expires - Date.now();
    var t = document.getElementById('t');
    if (t) t.style.width = Math.max(0, (left / total) * 100) + '%';
    if (expires && left < 15000) { expires = 0; refresh(); }
  }, 1000);
  api('/api/public/info').then(function (r) { info = r.data; document.title = (info.settings.businessName || 'Khatm') + ' · counter'; refresh(); });
})();
</script>
</body>
</html>
